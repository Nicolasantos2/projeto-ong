<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastro para participar do projeto social.">
  <title>Projeto ONG | Cadastro</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="logo" href="index.html" aria-label="Projeto ONG - página inicial">Projeto ONG</a>
      <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
      <nav class="nav" aria-label="Navegação principal">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link" href="projetos.html">Projetos</a>
        <a class="nav-link active" href="cadastro.html">Cadastro</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-banner">
      <div class="container">
        <span class="eyebrow">Participe</span>
        <h1>Cadastro</h1>
        <p>Preencha os dados para demonstrar interesse em participar das ações.</p>
      </div>
    </section>

    <section class="section">
      <div class="container form-container">
        <form id="form-cadastro" novalidate>
          <fieldset>
            <legend>Dados pessoais</legend>
            <div class="form-grid">
              <div class="form-group">
                <label for="nome">Nome completo</label>
                <input id="nome" name="nome" type="text" autocomplete="name" required>
              </div>
              <div class="form-group">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
              </div>
              <div class="form-group">
                <label for="cpf">CPF</label>
                <input id="cpf" name="cpf" type="text" inputmode="numeric" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" required>
              </div>
              <div class="form-group">
                <label for="telefone">Telefone</label>
                <input id="telefone" name="telefone" type="tel" inputmode="tel" pattern="\([0-9]{2}\)\s?[0-9]{4,5}-[0-9]{4}" placeholder="(41) 99999-9999" required>
              </div>
              <div class="form-group">
                <label for="cep">CEP</label>
                <input id="cep" name="cep" type="text" inputmode="numeric" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" required>
              </div>
              <div class="form-group">
                <label for="interesse">Área de interesse</label>
                <select id="interesse" name="interesse" required>
                  <option value="">Selecione</option>
                  <option value="educacao">Educação</option>
                  <option value="alimentacao">Alimentação</option>
                  <option value="solidariedade">Solidariedade</option>
                </select>
              </div>
            </div>
          </fieldset>

          <div id="mensagem-form" class="form-message" role="status" aria-live="polite"></div>
          <button class="btn btn-primary" type="submit">Enviar cadastro</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><p>&copy; 2026 Projeto ONG. Todos os direitos reservados.</p></div>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
